[project]
name = "bfa"
version = "0.1.0"
description = "Native game localization pipeline for Arabic support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.63.0",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "uharfbuzz>=0.56.0",
]

[project.scripts]
bfa = "bfa:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fonttools>=4.63.0",
    "pillow>=12.3.0",
    "uharfbuzz>=0.56.0",
]
